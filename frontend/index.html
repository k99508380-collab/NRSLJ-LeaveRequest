<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="NRSLJ Speciality Hospitals, Musiri - Employee Leave Management System">
  <meta name="theme-color" content="#0f2942">
  <title>NRSLJ Speciality Hospitals &bull; Leave Management System</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app-root">
    <!-- Top Header -->
    <header id="app-header" class="app-header"></header>

    <!-- Main Workspace Container -->
    <div class="app-container">
      <!-- Mobile Sidebar Backdrop Overlay -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Left Navigation Sidebar -->
      <aside id="app-sidebar" class="app-sidebar"></aside>

      <!-- Main Dynamic Content Workspace -->
      <main id="main-content" class="main-content">
        <div class="text-center" style="padding: 60px;">
          <span class="spinner" style="width: 32px; height: 32px;"></span>
          <p class="text-muted mt-md">Initializing NRSLJ Hospital Leave Portal...</p>
        </div>
      </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <!-- Application Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/auth.js"></script>

  <script src="js/views/employeeDashboard.js"></script>
  <script src="js/views/leaveApplyView.js"></script>
  <script src="js/views/leaveHistoryView.js"></script>
  <script src="js/views/managerDashboard.js"></script>
  <script src="js/views/adminDashboard.js"></script>
  <script src="js/views/adminEmployeesView.js"></script>
  <script src="js/views/adminLeaveConfigView.js"></script>
  <script src="js/views/adminReportsView.js"></script>
  <script src="js/views/hospitalSettingsView.js"></script>
  <script src="js/views/auditLogsView.js"></script>
  <script src="js/views/diagnosticsView.js"></script>

  <!-- Application Router & Orchestrator -->
  <script src="js/app.js"></script>
</body>
</html>
