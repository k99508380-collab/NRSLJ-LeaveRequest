<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f2942">
  <title>NRSLJ Speciality Hospitals, Musiri &bull; Leave Management System</title>
  <style>
/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Design System - Design Tokens & Variables
 */

:root {
  /* Brand Palette: Navy Blue & Healthcare Teal */
  --color-primary-950: #0a1928;
  --color-primary-900: #0f2942; /* Main Navy */
  --color-primary-800: #173859;
  --color-primary-700: #1f4e7c;
  --color-primary-600: #2966a3;
  --color-primary-100: #dbeafe;
  --color-primary-50:  #eff6ff;

  --color-teal-700: #0f766e;
  --color-teal-600: #0d9488; /* Main Teal */
  --color-teal-500: #14b8a6;
  --color-teal-400: #2dd4bf;
  --color-teal-100: #ccfbf1;
  --color-teal-50:  #f0fdfa;

  /* Neutrals & Surfaces */
  --color-bg: #f8fafc;
  --color-surface: #ffffff;
  --color-surface-hover: #f1f5f9;
  --color-surface-active: #e2e8f0;
  --color-border: #e2e8f0;
  --color-border-focus: #0d9488;
  --color-text-main: #0f172a;
  --color-text-muted: #64748b;
  --color-text-light: #94a3b8;

  /* Feedback & Status Accents */
  --color-success: #16a34a;
  --color-success-bg: #dcfce7;
  --color-success-text: #14532d;
  --color-success-border: #86efac;

  --color-warning: #d97706;
  --color-warning-bg: #fef3c7;
  --color-warning-text: #78350f;
  --color-warning-border: #fde68a;

  --color-danger: #dc2626;
  --color-danger-bg: #fee2e2;
  --color-danger-text: #7f1d1d;
  --color-danger-border: #fca5a5;

  --color-info: #0284c7;
  --color-info-bg: #e0f2fe;
  --color-info-text: #0369a1;
  --color-info-border: #7dd3fc;

  /* Typography */
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;

  /* Border Radii */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.03);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);

  /* Layout dimensions */
  --header-height: 64px;
  --sidebar-width: 260px;
  --sidebar-collapsed-width: 72px;

  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
}

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Base Styles & Layout Reset
 */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  min-height: 100%;
}

body {
  font-family: var(--font-family);
  background-color: var(--color-bg);
  color: var(--color-text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Accessibility: Focus visible */
:focus-visible {
  outline: 2px solid var(--color-teal-600);
  outline-offset: 2px;
}

/* Typography Defaults */
h1, h2, h3, h4, h5, h6 {
  color: var(--color-primary-900);
  font-weight: 700;
  line-height: 1.25;
}

h1 { font-size: 1.625rem; }
h2 { font-size: 1.375rem; }
h3 { font-size: 1.125rem; }
h4 { font-size: 1rem; }

p {
  margin-bottom: var(--space-sm);
}

a {
  color: var(--color-teal-600);
  text-decoration: none;
  transition: color var(--transition-fast);
}

a:hover {
  color: var(--color-teal-700);
  text-decoration: underline;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* Application Shell Layout - Natural Full-Page Scrolling */
#app-root {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-container {
  display: flex;
  flex: 1;
  position: relative;
  min-height: calc(100vh - var(--header-height));
  overflow: visible;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background-color: var(--color-bg);
  height: auto;
  min-height: 100%;
  overflow: visible;
  padding: var(--space-xl) var(--space-lg);
}

/* Utility Helpers */
.hidden { display: none !important; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-end { justify-content: flex-end; }
.justify-center { justify-content: center; }
.flex-wrap { flex-wrap: wrap; }
.gap-xs { gap: var(--space-xs); }
.gap-sm { gap: var(--space-sm); }
.gap-md { gap: var(--space-md); }
.gap-lg { gap: var(--space-lg); }

.grid { display: grid; }
.grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.w-full { width: 100%; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.text-muted { color: var(--color-text-muted); }
.text-sm { font-size: 0.875rem; }
.text-xs { font-size: 0.75rem; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }

.mt-sm { margin-top: var(--space-sm); }
.mt-md { margin-top: var(--space-md); }
.mt-lg { margin-top: var(--space-lg); }
.mb-sm { margin-bottom: var(--space-sm); }
.mb-md { margin-bottom: var(--space-md); }
.mb-lg { margin-bottom: var(--space-lg); }

/* Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: var(--color-bg);
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * UI Components - Header, Sidebar, Cards, Buttons, Tables, Forms, Badges, Modals
 */

/* ==========================================================================
   1. Header Bar
   ========================================================================== */
.app-header {
  height: var(--header-height);
  background-color: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-lg);
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: var(--shadow-sm);
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

.header-brand {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  text-decoration: none;
  flex-shrink: 0;
  user-select: none;
  -webkit-user-select: none;
}

.header-brand:hover {
  text-decoration: none;
}

.brand-text-container {
  display: flex;
  flex-direction: column;
  justify-content: center;
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
  will-change: auto;
}

.brand-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--color-primary-900);
  line-height: 1.25;
  letter-spacing: 0.25px;
  white-space: nowrap;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
}

.brand-subtitle {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--color-teal-600);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  white-space: nowrap;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.btn-icon {
  position: relative;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 8px;
  border-radius: var(--radius-full);
  color: var(--color-text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition-fast), color var(--transition-fast);
}

.btn-icon:hover {
  background-color: var(--color-surface-hover);
  color: var(--color-primary-900);
}

.badge-counter {
  position: absolute;
  top: 2px;
  right: 2px;
  background-color: var(--color-danger);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  border: 2px solid #fff;
}

.user-profile-badge {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: 6px 12px;
  background-color: var(--color-surface-hover);
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border);
  font-size: 0.875rem;
}

.user-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary-900), var(--color-teal-600));
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.8rem;
}

/* ==========================================================================
   2. Sidebar Navigation
   ========================================================================== */
.app-sidebar {
  width: var(--sidebar-width);
  background-color: var(--color-primary-900);
  color: #ffffff;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: calc(100vh - var(--header-height));
  position: sticky;
  top: var(--header-height);
  border-right: 1px solid var(--color-primary-800);
  transition: transform var(--transition-normal);
  z-index: 30;
}

.sidebar-nav {
  flex: 1;
  padding: var(--space-md) var(--space-sm);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-category-header {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--color-teal-400);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: var(--space-sm) var(--space-md) 4px;
  margin-top: var(--space-sm);
}

.nav-link {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: 10px var(--space-md);
  border-radius: var(--radius-md);
  color: #94a3b8;
  font-weight: 500;
  font-size: 0.9rem;
  text-decoration: none;
  transition: all var(--transition-fast);
  cursor: pointer;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}

.nav-link svg {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.nav-link:hover {
  background-color: rgba(255, 255, 255, 0.08);
  color: #ffffff;
  text-decoration: none;
}

.nav-link.active {
  background-color: var(--color-teal-600);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(13, 148, 136, 0.4);
}

.sidebar-footer {
  padding: var(--space-md);
  border-top: 1px solid var(--color-primary-800);
  background-color: rgba(0, 0, 0, 0.15);
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.6);
  z-index: 25;
  backdrop-filter: blur(2px);
}

/* ==========================================================================
   3. Cards & Stats
   ========================================================================== */
.card {
  background-color: var(--color-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.card-header {
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: var(--color-surface);
}

.card-title {
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--color-primary-900);
}

.card-subtitle {
  font-size: 0.85rem;
  color: var(--color-text-muted);
}

.card-body {
  padding: var(--space-lg);
  flex: 1;
}

.card-footer {
  padding: var(--space-md) var(--space-lg);
  border-top: 1px solid var(--color-border);
  background-color: var(--color-surface-hover);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-md);
}

/* Stat Cards */
.stat-card {
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.stat-title {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: var(--space-xs);
}

.stat-value {
  font-size: 1.875rem;
  font-weight: 800;
  color: var(--color-primary-900);
  line-height: 1;
}

.stat-subtitle {
  font-size: 0.75rem;
  color: var(--color-text-light);
  margin-top: 6px;
}

.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.stat-icon-navy { background-color: var(--color-primary-50); color: var(--color-primary-900); }
.stat-icon-teal { background-color: var(--color-teal-50); color: var(--color-teal-600); }
.stat-icon-amber { background-color: var(--color-warning-bg); color: var(--color-warning); }
.stat-icon-green { background-color: var(--color-success-bg); color: var(--color-success); }
.stat-icon-red { background-color: var(--color-danger-bg); color: var(--color-danger); }

/* Leave Balance Card */
.balance-card {
  border-left: 4px solid var(--color-teal-600);
}

.balance-progress-bar {
  height: 6px;
  background-color: var(--color-border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: var(--space-sm);
}

.balance-progress-fill {
  height: 100%;
  background-color: var(--color-teal-600);
  border-radius: 3px;
}

/* ==========================================================================
   4. Buttons
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: 10px 18px;
  min-height: 42px;
  font-weight: 600;
  font-size: 0.9rem;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
  user-select: none;
}

.btn:disabled, .btn[aria-disabled="true"] {
  opacity: 0.6;
  cursor: not-allowed;
  pointer-events: none;
}

.btn-primary {
  background-color: var(--color-teal-600);
  color: #ffffff;
  box-shadow: 0 1px 3px rgba(13, 148, 136, 0.3);
}

.btn-primary:hover {
  background-color: var(--color-teal-700);
}

.btn-navy {
  background-color: var(--color-primary-900);
  color: #ffffff;
}

.btn-navy:hover {
  background-color: var(--color-primary-800);
}

.btn-secondary {
  background-color: var(--color-surface-hover);
  color: var(--color-text-main);
  border-color: var(--color-border);
}

.btn-secondary:hover {
  background-color: var(--color-surface-active);
}

.btn-success {
  background-color: var(--color-success);
  color: #ffffff;
}

.btn-success:hover {
  background-color: #15803d;
}

.btn-danger {
  background-color: var(--color-danger);
  color: #ffffff;
}

.btn-danger:hover {
  background-color: #b91c1c;
}

.btn-outline {
  background-color: transparent;
  border-color: var(--color-border);
  color: var(--color-text-main);
}

.btn-outline:hover {
  background-color: var(--color-surface-hover);
  border-color: var(--color-text-muted);
}

.btn-sm {
  padding: 6px 12px;
  min-height: 32px;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

.btn-lg {
  padding: 14px 24px;
  min-height: 48px;
  font-size: 1rem;
}

/* ==========================================================================
   5. Form Controls
   ========================================================================== */
.form-group {
  margin-bottom: var(--space-md);
  display: flex;
  flex-direction: column;
}

.form-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--color-text-main);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.form-label .required {
  color: var(--color-danger);
  margin-left: 2px;
}

.form-control, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 14px;
  min-height: 42px;
  font-size: 0.95rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background-color: var(--color-surface);
  color: var(--color-text-main);
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.form-textarea {
  min-height: 90px;
  resize: vertical;
}

.form-control:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--color-teal-600);
  box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
  outline: none;
}

.form-hint {
  font-size: 0.75rem;
  color: var(--color-text-muted);
  margin-top: 4px;
}

.form-error {
  font-size: 0.75rem;
  color: var(--color-danger);
  margin-top: 4px;
  font-weight: 500;
}

.form-row {
  display: flex;
  gap: var(--space-md);
  flex-wrap: wrap;
}

.form-row > .form-group {
  flex: 1;
  min-width: 220px;
}

/* Radio & Checkbox buttons */
.radio-group, .checkbox-group {
  display: flex;
  gap: var(--space-md);
  margin-top: 4px;
}

.custom-radio-card {
  flex: 1;
  border: 1px solid var(--color-border);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all var(--transition-fast);
  background-color: var(--color-surface);
}

.custom-radio-card:hover {
  background-color: var(--color-surface-hover);
}

.custom-radio-card input:checked + span {
  font-weight: 600;
  color: var(--color-teal-700);
}

/* ==========================================================================
   6. Badges & Status Indicators
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 700;
  line-height: 1.3;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.badge-pending {
  background-color: var(--color-warning-bg);
  color: var(--color-warning-text);
  border: 1px solid var(--color-warning-border);
}

.badge-approved {
  background-color: var(--color-success-bg);
  color: var(--color-success-text);
  border: 1px solid var(--color-success-border);
}

.badge-rejected {
  background-color: var(--color-danger-bg);
  color: var(--color-danger-text);
  border: 1px solid var(--color-danger-border);
}

.badge-cancelled, .badge-withdrawn {
  background-color: #f1f5f9;
  color: #475569;
  border: 1px solid #cbd5e1;
}

.badge-active {
  background-color: var(--color-teal-50);
  color: var(--color-teal-700);
  border: 1px solid var(--color-teal-100);
}

/* Role Badges */
.badge-role-admin {
  background-color: #ede9fe;
  color: #5b21b6;

  <script>
/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Frontend Configuration & Storage Keys
 */

window.NRSLJ_CONFIG = {
  HOSPITAL_NAME: 'NRSLJ SPECIALITY HOSPITALS, MUSIRI',
  DEFAULT_LOGO_PATH: 'assets/logo.svg',
  
  // Storage Keys (Only non-secret session identifiers and UI preferences)
  STORAGE_KEYS: {
    SESSION_TOKEN: 'nrslj_session_token',
    USER_PROFILE: 'nrslj_user_profile',
    WEB_APP_URL: 'nrslj_web_app_url',
    HOSPITAL_LOGO: 'nrslj_custom_logo'
  },

  // Default Web App URL
  DEFAULT_WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbw2oV0ujrIqHwPOEn_7ZQ9loq9IlDugYdGrJoKtB6Epru5-q46cozBaLIuYxHVVDPU2tQ/exec',

  // Default Web App URL (Can be updated via UI Diagnostics screen or environment)
  getWebAppUrl: function() {
    var stored = localStorage.getItem(this.STORAGE_KEYS.WEB_APP_URL);
    if (stored && stored.trim().length > 0) {
      return stored.trim();
    }
    return this.DEFAULT_WEB_APP_URL;
  },

  setWebAppUrl: function(url) {
    if (url) {
      localStorage.setItem(this.STORAGE_KEYS.WEB_APP_URL, url.trim());
    } else {
      localStorage.removeItem(this.STORAGE_KEYS.WEB_APP_URL);
    }
  }
};

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Unified API Client Adapter
 * Seamlessly supports both Google Apps Script HTML Service and Standalone Web App
 */

window.NRSLJ_API = (function() {
  var isGasEnvironment = typeof google !== 'undefined' && google.script && google.script.run;

  /**
   * Main dispatch method
   */
  function call(action, data) {
    var sessionToken = localStorage.getItem(window.NRSLJ_CONFIG.STORAGE_KEYS.SESSION_TOKEN) || '';

    if (isGasEnvironment) {
      return callGas(action, sessionToken, data);
    } else {
      return callHttp(action, sessionToken, data);
    }
  }

  /**
   * Google Apps Script HTML Service Runner
   */
  function callGas(action, sessionToken, data) {
    return new Promise(function(resolve, reject) {
      try {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response && response.success) {
              resolve(response.data);
            } else {
              var errMsg = response && response.message ? response.message : 'Operation failed';
              reject(new Error(errMsg));
            }
          })
          .withFailureHandler(function(err) {
            reject(new Error(err && err.message ? err.message : 'Apps Script backend execution error'));
          })
          .apiDispatcher(action, sessionToken, data || {});
      } catch (e) {
        reject(e);
      }
    });
  }

  /**
   * Standalone HTTP Fetch to Google Apps Script Web App URL
   * Uses text/plain to avoid CORS preflight issues
   */
  function callHttp(action, sessionToken, data) {
    var webAppUrl = window.NRSLJ_CONFIG.getWebAppUrl();

    if (!webAppUrl) {
      return Promise.reject(new Error(
        'Backend URL not configured. Click "Connection Diagnostics" in the header to configure your Google Apps Script Web App URL.'
      ));
    }

    var payload = {
      action: action,
      sessionToken: sessionToken,
      data: data || {}
    };

    return fetch(webAppUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload),
      redirect: 'follow'
    })
    .then(function(res) {
      if (!res.ok) {
        throw new Error('Server returned HTTP ' + res.status + ' ' + res.statusText);
      }
      return res.json();
    })
    .then(function(json) {
      if (json && json.success) {
        return json.data;
      } else {
        var msg = json && json.message ? json.message : 'Backend operation failed';
        var err = new Error(msg);
        err.code = json ? json.errorCode : 'UNKNOWN';
        throw err;
      }
    })
    .catch(function(err) {
      if (err.name === 'TypeError' && err.message.toLowerCase().indexOf('fetch') !== -1) {
        throw new Error('Network error or CORS issue contacting Apps Script backend. Ensure the web app is deployed with "Who has access: Anyone".');
      }
      throw err;
    });
  }

  /**
   * Health check utility
   */
  function ping(customUrl) {
    var targetUrl = customUrl || window.NRSLJ_CONFIG.getWebAppUrl();
    if (isGasEnvironment) {
      return callGas('healthCheck', '', {});
    }

    if (!targetUrl) {
      return Promise.reject(new Error('No Web App URL provided'));
    }

    var payload = { action: 'healthCheck', sessionToken: '', data: {} };
    return fetch(targetUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    })
    .then(function(r) { return r.json(); })
    .then(function(j) {
      if (j && j.success) return j.data;
      throw new Error(j ? j.message : 'Health check failed');
    });
  }

  return {
    call: call,
    ping: ping,
    isGasEnvironment: function() { return isGasEnvironment; }
  };
})();

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Global Reactive Application State Store
 */

window.NRSLJ_STATE = (function() {
  var state = {
    currentUser: null,
    sessionToken: localStorage.getItem(window.NRSLJ_CONFIG.STORAGE_KEYS.SESSION_TOKEN) || null,
    currentRoute: 'dashboard',
    hospitalSettings: {
      HOSPITAL_NAME: window.NRSLJ_CONFIG.HOSPITAL_NAME,
      LOGO_URL: '',
      APPROVAL_WORKFLOW: 'MANAGER_THEN_HR'
    },
    notifications: [],
    unreadCount: 0,
    departments: [],
    designations: [],
    leaveTypes: []
  };

  var listeners = [];

  function subscribe(fn) {
    listeners.push(fn);
    return function unsubscribe() {
      listeners = listeners.filter(function(l) { return l !== fn; });
    };
  }

  function notify(changedKey) {
    for (var i = 0; i < listeners.length; i++) {
      try {
        listeners[i](state, changedKey);
      } catch (e) {
        console.error('State subscriber error:', e);
      }
    }
  }

  function setUser(user, token) {
    state.currentUser = user;
    if (token) {
      state.sessionToken = token;
      localStorage.setItem(window.NRSLJ_CONFIG.STORAGE_KEYS.SESSION_TOKEN, token);
      localStorage.setItem(window.NRSLJ_CONFIG.STORAGE_KEYS.USER_PROFILE, JSON.stringify(user));
    }
    notify('user');
  }

  function clearUser() {
    state.currentUser = null;
    state.sessionToken = null;
    state.notifications = [];
    state.unreadCount = 0;
    localStorage.removeItem(window.NRSLJ_CONFIG.STORAGE_KEYS.SESSION_TOKEN);
    localStorage.removeItem(window.NRSLJ_CONFIG.STORAGE_KEYS.USER_PROFILE);
    notify('user');
  }

  function setRoute(route) {
    state.currentRoute = route;
    notify('route');
  }

  function setNotifications(notifs) {
    state.notifications = notifs || [];
    var unread = 0;
    for (var i = 0; i < state.notifications.length; i++) {
      if (!state.notifications[i].ReadAt) unread++;
    }
    state.unreadCount = unread;
    notify('notifications');
  }

  function setHospitalSettings(settings) {
    if (settings) {
      state.hospitalSettings = Object.assign({}, state.hospitalSettings, settings);
      notify('settings');
    }
  }

  return {
    get: function() { return state; },
    subscribe: subscribe,
    setUser: setUser,
    clearUser: clearUser,
    setRoute: setRoute,
    setNotifications: setNotifications,
    setHospitalSettings: setHospitalSettings
  };
})();

 * Toast Notification Component
 */

window.NRSLJ_TOAST = (function() {
  var container = null;

  function getContainer() {
    if (!container) {
      container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }
    }
    return container;
  }

  function show(message, type, durationMs) {
    var c = getContainer();
    var toast = document.createElement('div');
    var toastType = type || 'info';
    toast.className = 'toast toast-' + toastType;

    var iconSvg = '';
    if (toastType === 'success') {
      iconSvg = '<svg width="20" height="20" fill="none" stroke="#16a34a" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
    } else if (toastType === 'error') {
      iconSvg = '<svg width="20" height="20" fill="none" stroke="#dc2626" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    } else if (toastType === 'warning') {
      iconSvg = '<svg width="20" height="20" fill="none" stroke="#d97706" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4m0 4h.01"/></svg>';
    } else {
      iconSvg = '<svg width="20" height="20" fill="none" stroke="#0d9488" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>';
    }

    toast.innerHTML = iconSvg + '<div class="toast-message">' + escapeHtml(message) + '</div>';
    c.appendChild(toast);

    var timer = setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(20px)';
      toast.style.transition = 'all 200ms ease';
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 200);
    }, durationMs || 4000);

    toast.addEventListener('click', function() {
      clearTimeout(timer);
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    success: function(msg, dur) { show(msg, 'success', dur); },
    error: function(msg, dur) { show(msg, 'error', dur); },
    warning: function(msg, dur) { show(msg, 'warning', dur); },
    info: function(msg, dur) { show(msg, 'info', dur); }
  };
})();

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Accessible Modal Dialog Component
 */

window.NRSLJ_MODAL = (function() {
  var activeModal = null;

  function open(options) {
    close(); // Close any currently open modal

    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.id = 'active-modal-backdrop';
    backdrop.setAttribute('role', 'dialog');
    backdrop.setAttribute('aria-modal', 'true');

    var dialog = document.createElement('div');
    dialog.className = 'modal-dialog' + (options.size === 'lg' ? ' modal-dialog-lg' : '');

    var header = document.createElement('div');
    header.className = 'modal-header';
    header.innerHTML = '<h3 class="modal-title">' + (options.title || 'Notification') + '</h3>' +
      '<button type="button" class="btn-icon" aria-label="Close modal" id="modal-close-btn">' +
      '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
      '</button>';

    var body = document.createElement('div');
    body.className = 'modal-body';
    if (typeof options.body === 'string') {
      body.innerHTML = options.body;
    } else if (options.body instanceof HTMLElement) {
      body.appendChild(options.body);
    }

    dialog.appendChild(header);
    dialog.appendChild(body);

    if (options.footer) {
      var footer = document.createElement('div');
      footer.className = 'modal-footer';
      if (typeof options.footer === 'string') {
        footer.innerHTML = options.footer;
      } else if (options.footer instanceof HTMLElement) {
        footer.appendChild(options.footer);
      }
      dialog.appendChild(footer);
    }

    backdrop.appendChild(dialog);
    document.body.appendChild(backdrop);
    activeModal = backdrop;

    // Events
    header.querySelector('#modal-close-btn').addEventListener('click', close);

    backdrop.addEventListener('click', function(e) {
      if (e.target === backdrop) close();
    });

    document.addEventListener('keydown', handleEscKey);

    if (options.onOpen) {
      options.onOpen(dialog);
    }

    return dialog;
  }

  function handleEscKey(e) {
    if (e.key === 'Escape') close();
  }

  function close() {
    if (activeModal && activeModal.parentNode) {
      activeModal.parentNode.removeChild(activeModal);
    }
    document.removeEventListener('keydown', handleEscKey);
    activeModal = null;
  }

  return {
    open: open,
    close: close
  };
})();

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Authentication Controller & Session Guard
 */

window.NRSLJ_AUTH = (function() {
  function checkSession() {
    var token = localStorage.getItem(window.NRSLJ_CONFIG.STORAGE_KEYS.SESSION_TOKEN);
    if (!token) {
      return Promise.resolve(null);
    }

    return window.NRSLJ_API.call('getProfile', {})
      .then(function(user) {
        window.NRSLJ_STATE.setUser(user, token);
        // Load initial notifications & hospital info
        loadInitialData();
        return user;
      })
      .catch(function(err) {
        console.warn('Session expired or invalid:', err.message);
        window.NRSLJ_STATE.clearUser();
        return null;
      });
  }

  function login(identifier, password) {
    return window.NRSLJ_API.call('login', {
      identifier: identifier,
      password: password
    })
    .then(function(res) {
      window.NRSLJ_STATE.setUser(res.user, res.sessionToken);
      window.NRSLJ_TOAST.success('Welcome, ' + (res.user.FullName || res.user.Username));
      
      // Load initial notifications & hospital info
      loadInitialData();

      // Route based on role
      if (res.user.Role === 'ADMIN') {
        window.NRSLJ_STATE.setRoute('admin-dashboard');
      } else if (res.user.Role === 'MANAGER') {
        window.NRSLJ_STATE.setRoute('manager-dashboard');
      } else {
        window.NRSLJ_STATE.setRoute('dashboard');
      }

      return res.user;
    });
  }

  function register(data) {
    return window.NRSLJ_API.call('register', data);
  }

  function logout() {
    var token = window.NRSLJ_STATE.get().sessionToken;
    if (token) {
      window.NRSLJ_API.call('logout', {})
        .catch(function(e) { /* non-fatal */ });
    }
    window.NRSLJ_STATE.clearUser();
    window.NRSLJ_STATE.setRoute('auth');
    window.NRSLJ_TOAST.info('Logged out successfully');
  }

  function loadInitialData() {
    // 1. Fetch public/hospital settings
    window.NRSLJ_API.call('getPublicHospitalInfo', {})
      .then(function(info) {
        if (info) {
          window.NRSLJ_STATE.setHospitalSettings({
            HOSPITAL_NAME: info.hospitalName,
            LOGO_URL: info.logoUrl
          });
        }
      })
      .catch(function() {});

    // 2. Fetch notifications
    window.NRSLJ_API.call('getNotifications', { onlyUnread: false })
      .then(function(notifs) {
        window.NRSLJ_STATE.setNotifications(notifs);
      })
      .catch(function() {});
  }

  return {
    checkSession: checkSession,
    login: login,
    register: register,
    logout: logout,
    loadInitialData: loadInitialData
  };
})();

      tabLogin.classList.remove('active');
      paneSignup.classList.remove('hidden');
      paneLogin.classList.add('hidden');

      e.preventDefault();
      var id = document.getElementById('login-identifier').value.trim();
      var pass = document.getElementById('login-password').value;
      var btn = document.getElementById('login-submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      window.NRSLJ_AUTH.login(id, pass)
        .catch(function(err) {
          window.NRSLJ_TOAST.error(err.message);
        })
        .finally(function() {
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In</span>';
        });
    });

    // Registration Form Submit
    document.getElementById('signup-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var pass = document.getElementById('reg-password').value;
      var confirmPass = document.getElementById('reg-confirmpassword').value;

      if (pass !== confirmPass) {
        window.NRSLJ_TOAST.error('Passwords do not match');
        return;
      }

      var payload = {
        FullName: document.getElementById('reg-fullname').value.trim(),
        EmployeeID: document.getElementById('reg-empid').value.trim().toUpperCase(),
        Username: document.getElementById('reg-username').value.trim().toLowerCase(),
        Phone: document.getElementById('reg-phone').value.trim(),
        Password: pass
      };

      var btn = document.getElementById('signup-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Submitting...';

      window.NRSLJ_AUTH.register(payload)
        .then(function(res) {
          window.NRSLJ_MODAL.open({
            title: 'Registration Submitted',
            body: '<div class="text-center" style="padding: 20px;">' +
              '<svg width="48" height="48" fill="none" stroke="#0d9488" stroke-width="2" viewBox="0 0 24 24" style="margin: 0 auto 16px;"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
              '<h4 style="color: var(--color-primary-900); margin-bottom: 8px;">Registration Under Review</h4>' +
              '<p class="text-sm text-muted">Your account request for <strong>' + escapeHtml(payload.FullName) + '</strong> (' + escapeHtml(payload.EmployeeID) + ') has been registered with status <strong>PENDING</strong>.</p>' +
              '<p class="text-sm text-muted">Hospital Admin/HR will assign your department, designation, and reporting manager before activating your login.</p>' +
              '</div>',
            footer: '<button type="button" class="btn btn-primary" onclick="window.NRSLJ_MODAL.close()">Back to Sign In</button>'
          });

          // Switch back to login tab
          tabLogin.click();
        })
        .catch(function(err) {
          window.NRSLJ_TOAST.error(err.message);
        })
        .finally(function() {
          btn.disabled = false;
          btn.innerHTML = '<span>Submit Registration</span>';
        });
    });

    var configBackendBtn = document.getElementById('auth-config-backend-btn');
    if (configBackendBtn) {
      configBackendBtn.addEventListener('click', function() {
        window.NRSLJ_STATE.setRoute('diagnostics');
      });
    }
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

window.NRSLJ_EMPLOYEE_DASHBOARD = (function() {
  function render(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var state = window.NRSLJ_STATE.get();
    var user = state.currentUser;
    if (!user) {
      window.NRSLJ_STATE.setRoute('auth');
      return;
    }

    container.innerHTML = '<div class="text-center" style="padding: 60px;"><span class="spinner" style="width: 32px; height: 32px;"></span><p class="text-muted mt-md">Loading your leave summary...</p></div>';

    // Parallel fetch balances and recent requests
    Promise.all([
      window.NRSLJ_API.call('getEmployeeBalances', { leaveYear: new Date().getFullYear() }),
      window.NRSLJ_API.call('getMyLeaveRequests', {})
    ])
    .then(function(results) {
      var balances = results[0] || [];
      var requests = results[1] || [];
      renderContent(container, user, balances, requests);
    })
    .catch(function(err) {
      container.innerHTML = '<div class="alert alert-danger" style="margin: 20px;">' +
        '<strong>Error loading dashboard:</strong> ' + escapeHtml(err.message) +
        '<button class="btn btn-sm btn-outline mt-sm" onclick="window.NRSLJ_EMPLOYEE_DASHBOARD.render(\'' + containerId + '\')">Retry</button>' +
        '</div>';
    });
  }

  function renderContent(container, user, balances, requests) {
    var totalAllocated = 0;
    var totalUsed = 0;
    var totalPending = 0;
    var totalAvailable = 0;

    for (var i = 0; i < balances.length; i++) {
      var b = balances[i];
      if (b.RequiresBalance) {
        totalAllocated += Number(b.Allocated) || 0;
        totalUsed += Number(b.Used) || 0;
        totalPending += Number(b.PendingDays) || 0;
        totalAvailable += Number(b.AvailableBalance) || 0;
      }
    }

    var html = '' +
      // Welcome banner
      '<div class="flex justify-between items-center mb-lg flex-wrap gap-md">' +
        '<div>' +
          '<h1 style="color: var(--color-primary-900); font-size: 1.5rem;">Welcome, ' + escapeHtml(user.FullName || user.Username) + '</h1>' +
          '<p class="text-sm text-muted" style="margin-top: 2px;">' +
            '<span>Employee ID: <strong>' + escapeHtml(user.EmployeeID) + '</strong></span> &bull; ' +
            '<span>Role: <strong class="badge badge-role-' + user.Role.toLowerCase() + '">' + user.Role + '</strong></span>' +
          '</p>' +
        '</div>' +
        '<div class="flex gap-sm flex-wrap">' +
          '<button type="button" class="btn btn-primary" id="dash-apply-btn">' +
            '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>' +
            '<span>Apply for Leave</span>' +
          '</button>' +
          '<button type="button" class="btn btn-outline" id="dash-history-btn">' +
            '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
            '<span>View History</span>' +
          '</button>' +
        '</div>' +
      '</div>' +

      // Top Metric Cards
      '<div class="grid grid-cols-4 gap-md mb-lg">' +
        '<div class="stat-card">' +
          '<div>' +
            '<div class="stat-title">Total Allocated</div>' +
            '<div class="stat-value">' + totalAllocated + ' <span class="text-sm text-muted">days</span></div>' +
            '<div class="stat-subtitle">Calendar Year ' + new Date().getFullYear() + '</div>' +
          '</div>' +
          '<div class="stat-icon stat-icon-navy">' +
            '<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' +
          '</div>' +
        '</div>' +

        '<div class="stat-card">' +
          '<div>' +
            '<div class="stat-title">Available Balance</div>' +
            '<div class="stat-value" style="color: var(--color-teal-600);">' + totalAvailable + ' <span class="text-sm text-muted">days</span></div>' +
            '<div class="stat-subtitle">Remaining balance</div>' +
          '</div>' +
          '<div class="stat-icon stat-icon-teal">' +
            '<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
          '</div>' +
        '</div>' +

        '<div class="stat-card">' +
          '<div>' +
            '<div class="stat-title">Pending Approval</div>' +
            '<div class="stat-value" style="color: var(--color-warning);">' + totalPending + ' <span class="text-sm text-muted">days</span></div>' +
            '<div class="stat-subtitle">In manager / HR queue</div>' +
          '</div>' +
          '<div class="stat-icon stat-icon-amber">' +
            '<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
          '</div>' +
        '</div>' +

        '<div class="stat-card">' +
          '<div>' +
            '<div class="stat-title">Leaves Taken</div>' +
            '<div class="stat-value">' + totalUsed + ' <span class="text-sm text-muted">days</span></div>' +
            '<div class="stat-subtitle">Approved & utilized</div>' +
          '</div>' +
          '<div class="stat-icon stat-icon-green">' +
            '<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // Balance Breakdown by Leave Type
      '<div class="mb-lg">' +
        '<h2 class="mb-md" style="font-size: 1.15rem; color: var(--color-primary-900);">Leave Type Balances</h2>' +
        '<div class="grid grid-cols-3 gap-md">';

    for (var j = 0; j < balances.length; j++) {
      var bal = balances[j];
      var alloc = Number(bal.Allocated) || 0;
      var used = Number(bal.Used) || 0;
      var avail = Number(bal.AvailableBalance) || 0;
      var pend = Number(bal.PendingDays) || 0;
      var pct = alloc > 0 ? Math.min(100, Math.round((used / alloc) * 100)) : 0;

      html += '' +
        '<div class="card balance-card">' +
          '<div class="card-header">' +
            '<div>' +
              '<div class="card-title" style="font-size: 1rem;">' + escapeHtml(bal.LeaveTypeName) + '</div>' +
              '<div class="card-subtitle text-xs">' + escapeHtml(bal.Description || 'Standard leave') + '</div>' +
            '</div>' +
            '<div class="badge badge-active">' + avail + ' Left</div>' +
          '</div>' +
          '<div class="card-body">' +
            '<div class="flex justify-between items-center text-sm mb-xs">' +
              '<span class="text-muted">Used: <strong>' + used + '</strong> / ' + alloc + ' d</span>' +
              (pend > 0 ? '<span class="text-warning text-xs font-semibold">' + pend + ' d pending</span>' : '') +
            '</div>' +
            '<div class="balance-progress-bar">' +
              '<div class="balance-progress-fill" style="width: ' + pct + '%;"></div>' +
            '</div>' +
            '<div class="flex justify-between text-xs text-muted mt-sm">' +
              '<span>Notice: ' + bal.NoticePeriod + ' day(s)</span>' +
              '<span>Max: ' + bal.MaximumDuration + ' d/request</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    html += '</div></div>' +

      // Recent Activity Table
      '<div class="card mb-lg">' +
        '<div class="card-header">' +
          '<div>' +
            '<div class="card-title">Recent Leave Requests</div>' +
            '<div class="card-subtitle">Your latest leave applications and decision updates</div>' +
          '</div>' +
          '<button type="button" class="btn btn-outline btn-sm" id="recent-view-all-btn">View All</button>' +
        '</div>' +
        '<div class="table-responsive">' +
          '<table class="data-table table-responsive-cards">' +
            '<thead>' +
              '<tr>' +
                '<th>Request ID</th>' +
                '<th>Leave Type</th>' +
                '<th>Dates</th>' +
                '<th>Days</th>' +
                '<th>Reason</th>' +
                '<th>Status</th>' +
                '<th>Submitted</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>';

    if (requests.length === 0) {
      html += '<tr><td colspan="7" class="text-center text-muted" style="padding: 30px;">You have not submitted any leave requests yet. Click "Apply for Leave" above to create one.</td></tr>';
    } else {
      var recent = requests.slice(0, 5);
      for (var k = 0; k < recent.length; k++) {
        var r = recent[k];
        var badgeCls = 'badge-pending';
        if (r.Status === 'APPROVED') badgeCls = 'badge-approved';
        else if (r.Status === 'REJECTED') badgeCls = 'badge-rejected';
        else if (r.Status === 'CANCELLED' || r.Status === 'WITHDRAWN') badgeCls = 'badge-cancelled';

        html += '' +
          '<tr>' +
            '<td data-label="Request ID"><strong style="color: var(--color-primary-900);">' + escapeHtml(r.RequestID) + '</strong></td>' +
            '<td data-label="Leave Type">' + escapeHtml(r.LeaveTypeName || r.LeaveTypeID) + '</td>' +
            '<td data-label="Dates">' + r.StartDate + (r.StartDate !== r.EndDate ? ' to ' + r.EndDate : '') + '</td>' +
            '<td data-label="Days">' + r.RequestedDays + ' (' + r.DayPart + ')</td>' +
            '<td data-label="Reason" style="max-width: 260px; word-break: break-word;" title="' + escapeHtml(r.Reason) + '">' + escapeHtml(r.Reason) + '</td>' +
            '<td data-label="Status"><span class="badge ' + badgeCls + '">' + r.Status.replace('_', ' ') + '</span></td>' +
            '<td data-label="Submitted">' + (r.SubmittedAt ? r.SubmittedAt.substring(0, 10) : '') + '</td>' +
          '</tr>';
      }
    }

    html += '</tbody></table></div></div>';

    container.innerHTML = html;

    // Attach Click Events
    document.getElementById('dash-apply-btn').addEventListener('click', function() {
      window.NRSLJ_STATE.setRoute('apply-leave');
    });

    document.getElementById('dash-history-btn').addEventListener('click', function() {
      window.NRSLJ_STATE.setRoute('leave-history');
    });

    var viewAllBtn = document.getElementById('recent-view-all-btn');
    if (viewAllBtn) {
      viewAllBtn.addEventListener('click', function() {
        window.NRSLJ_STATE.setRoute('leave-history');
      });
    }
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

            '<form id="leave-application-form">' +

              // Employee Info Summary Banner
              '<div style="background-color: var(--color-surface-hover); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px;" class="flex justify-between items-center flex-wrap gap-sm text-xs">' +
                '<div>' +
                  '<strong>Applicant: </strong><span>' + escapeHtml(user.FullName) + ' (' + escapeHtml(user.EmployeeID) + ')</span>' +
                '</div>' +
                '<div>' +
                  '<strong>Reporting Manager: </strong><span>' + (user.ReportingManagerID ? escapeHtml(user.ReportingManagerID) : '<span class="text-muted">Direct Hospital Admin Queue</span>') + '</span>' +
                '</div>' +
              '</div>' +

              // Leave Type selection
              '<div class="form-group">' +
                '<label class="form-label" for="apply-leave-type">Leave Type <span class="required">*</span></label>' +
                '<select id="apply-leave-type" class="form-select" required>' +
                  '<option value="">-- Select Leave Category --</option>';

    for (var i = 0; i < balances.length; i++) {
      var b = balances[i];
      var availText = b.RequiresBalance ? ' (' + b.AvailableBalance + ' days available)' : ' (Balance not required)';
      html += '<option value="' + b.LeaveTypeID + '" data-avail="' + b.AvailableBalance + '" data-reqbal="' + b.RequiresBalance + '" data-max="' + b.MaximumDuration + '" data-notice="' + b.NoticePeriod + '" data-neg="' + b.NegativeBalanceAllowed + '" data-weekends="' + b.WeekendsPolicy + '" data-holidays="' + b.HolidaysPolicy + '">' +
        escapeHtml(b.LeaveTypeName) + availText +
        '</option>';
    }

    html += '</select>' +
              '</div>' +

              // Day Part selection
              '<div class="form-group">' +
                '<label class="form-label">Day Duration <span class="required">*</span></label>' +
                '<div class="radio-group">' +
                  '<label class="custom-radio-card">' +
                    '<input type="radio" name="day-part" value="FULL" checked> <span>Full Day(s)</span>' +
                  '</label>' +
                  '<label class="custom-radio-card">' +
                    '<input type="radio" name="day-part" value="FIRST_HALF"> <span>Half Day (Morning Session)</span>' +
                  '</label>' +
                  '<label class="custom-radio-card">' +
                    '<input type="radio" name="day-part" value="SECOND_HALF"> <span>Half Day (Afternoon Session)</span>' +
                  '</label>' +
                '</div>' +
              '</div>' +

              // Date pickers
              '<div class="form-row">' +
                '<div class="form-group">' +
                  '<label class="form-label" for="apply-start-date">Start Date <span class="required">*</span></label>' +
                  '<input type="date" id="apply-start-date" class="form-control" value="' + todayStr + '" required>' +
                '</div>' +
                '<div class="form-group" id="end-date-group">' +
                  '<label class="form-label" for="apply-end-date">End Date <span class="required">*</span></label>' +
                  '<input type="date" id="apply-end-date" class="form-control" value="' + todayStr + '" required>' +
                '</div>' +
              '</div>' +

              // Live Summary Card
              '<div id="duration-summary-box" style="background: var(--color-teal-50); border: 1px solid var(--color-teal-100); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 20px;">' +
                '<div class="flex justify-between items-center">' +
                  '<div>' +
                    '<span class="text-xs font-semibold text-muted" style="text-transform: uppercase;">Estimated Requested Working Days</span>' +
                    '<div id="summary-days-value" style="font-size: 1.5rem; font-weight: 800; color: var(--color-teal-700);">1.0 Day(s)</div>' +
                  '</div>' +
                  '<div id="summary-balance-status" class="text-right text-xs text-muted">' +
                    '<div>Sundays / Holidays excluded per policy</div>' +
                    '<div id="summary-avail-note"></div>' +
                  '</div>' +
                '</div>' +
              '</div>' +

              // Reason
              '<div class="form-group">' +
                '<label class="form-label" for="apply-reason">Reason for Leave <span class="required">*</span></label>' +
                '<textarea id="apply-reason" class="form-textarea" placeholder="State the reason for your absence (minimum 5 characters)..." required minlength="5"></textarea>' +
                '<span class="form-hint">Please provide sufficient detail for administrative and medical coverage planning.</span>' +
              '</div>' +

              // Optional contact and attachment
              '<div class="form-row">' +
                '<div class="form-group">' +
                  '<label class="form-label" for="apply-contact">Emergency Contact Phone (Optional)</label>' +
                  '<input type="tel" id="apply-contact" class="form-control" placeholder="Alternate phone during absence">' +
                '</div>' +
                '<div class="form-group">' +
                  '<label class="form-label" for="apply-attachment">Supporting Document Ref / Link (Optional)</label>' +
                  '<input type="text" id="apply-attachment" class="form-control" placeholder="e.g. Medical certificate reference or document URL">' +
                '</div>' +
              '</div>' +

              '<div class="card-footer mt-md" style="padding-left: 0; padding-right: 0; background: transparent; border-top: 1px solid var(--color-border);">' +
                '<button type="button" class="btn btn-secondary" id="apply-cancel-btn">Cancel</button>' +
                '<button type="submit" class="btn btn-primary" id="apply-submit-btn">' +
                  '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' +
                  '<span>Submit Application</span>' +
                '</button>' +
              '</div>' +

            '</form>' +
          '</div>' +
        '</div>' +
      '</div>';

    container.innerHTML = html;

    // Attach Interactive Calculation Events
    var typeSelect = document.getElementById('apply-leave-type');
    var startDateInput = document.getElementById('apply-start-date');
    var endDateInput = document.getElementById('apply-end-date');
    var endDateGroup = document.getElementById('end-date-group');
    var dayPartRadios = document.querySelectorAll('input[name="day-part"]');
    var summaryDaysVal = document.getElementById('summary-days-value');
    var summaryAvailNote = document.getElementById('summary-avail-note');
    var submitBtn = document.getElementById('apply-submit-btn');

    function getSelectedDayPart() {
      for (var r = 0; r < dayPartRadios.length; r++) {
        if (dayPartRadios[r].checked) return dayPartRadios[r].value;
      }
      return 'FULL';
    }

    function recalculateDuration() {
      var dayPart = getSelectedDayPart();
      var start = startDateInput.value;
      var end = endDateInput.value;

      if (dayPart !== 'FULL') {
        endDateGroup.style.display = 'none';
        endDateInput.value = start;
        end = start;
      } else {
        endDateGroup.style.display = 'block';
      }

      if (!start || !end) {
        summaryDaysVal.innerText = '0 Day(s)';
        return 0;
      }

      var sDate = new Date(start + 'T00:00:00');
      var eDate = new Date(end + 'T00:00:00');

      if (sDate > eDate) {
        summaryDaysVal.innerText = 'Invalid Date Range (Start > End)';
        summaryDaysVal.style.color = 'var(--color-danger)';
        submitBtn.disabled = true;
        return 0;
      }

      if (dayPart !== 'FULL') {
        summaryDaysVal.innerText = '0.5 Day (Half Day)';
        summaryDaysVal.style.color = 'var(--color-teal-700)';
        submitBtn.disabled = false;
        checkBalance(0.5);
        return 0.5;
      }

      // Calculate working days (excluding Sundays and holidays)
      var opt = typeSelect.selectedOptions[0];
      var weekendsPolicy = opt ? opt.getAttribute('data-weekends') : 'EXCLUDE_SUNDAYS';
      var holidaysPolicy = opt ? opt.getAttribute('data-holidays') : 'EXCLUDE_HOLIDAYS';

      var cur = new Date(sDate.getTime());
      var count = 0;
      var holidayDates = holidays.map(function(h) { return String(h.HolidayDate).substring(0, 10); });

      while (cur <= eDate) {
        var day = cur.getDay(); // 0 is Sunday
        var iso = cur.toISOString().substring(0, 10);
        var isWeekend = (weekendsPolicy === 'EXCLUDE_SUNDAYS' && day === 0) || (weekendsPolicy === 'EXCLUDE_WEEKENDS' && (day === 0 || day === 6));
        var isHol = (holidaysPolicy !== 'INCLUDE_ALL') && (holidayDates.indexOf(iso) !== -1);

        if (!isWeekend && !isHol) {
          count++;
        }
        cur.setDate(cur.getDate() + 1);
      }

      summaryDaysVal.innerText = count + ' Working Day(s)';
      summaryDaysVal.style.color = count > 0 ? 'var(--color-teal-700)' : 'var(--color-warning)';
      submitBtn.disabled = count <= 0;

      checkBalance(count);
      return count;
    }

    function checkBalance(reqDays) {
      var opt = typeSelect.selectedOptions[0];
      if (!opt || !opt.value) {
        summaryAvailNote.innerHTML = '';
        return;
      }

      var reqBal = opt.getAttribute('data-reqbal') === 'true';
      var avail = parseFloat(opt.getAttribute('data-avail') || '0');
      var neg = opt.getAttribute('data-neg') === 'true';

      if (reqBal) {
        if (reqDays > avail && !neg) {
          summaryAvailNote.innerHTML = '<span style="color: var(--color-danger); font-weight: 700;">&bull; Exceeds available balance (' + avail + ' days available)</span>';
          submitBtn.disabled = true;
        } else {
          summaryAvailNote.innerHTML = '<span style="color: var(--color-success);">&bull; Sufficient balance available (' + avail + ' days)</span>';
          submitBtn.disabled = false;
        }
      } else {
        summaryAvailNote.innerHTML = '<span class="text-muted">&bull; Balance deduction not required for this type</span>';
        submitBtn.disabled = false;
      }
    }

    // Attach change handlers
    typeSelect.addEventListener('change', recalculateDuration);
    startDateInput.addEventListener('change', function() {
      if (getSelectedDayPart() !== 'FULL' || !endDateInput.value || endDateInput.value < startDateInput.value) {
        endDateInput.value = startDateInput.value;
      }
      recalculateDuration();
    });
    endDateInput.addEventListener('change', recalculateDuration);
    for (var r = 0; r < dayPartRadios.length; r++) {
      dayPartRadios[r].addEventListener('change', recalculateDuration);
    }

    // Initial calculation
    recalculateDuration();

    // Form Submission
    document.getElementById('leave-application-form').addEventListener('submit', function(e) {
      e.preventDefault();

      var typeId = typeSelect.value;
      if (!typeId) {
        window.NRSLJ_TOAST.error('Please select a leave category');
        return;
      }

      var start = startDateInput.value;
      var end = endDateInput.value;
      var dayPart = getSelectedDayPart();
      var reason = document.getElementById('apply-reason').value.trim();
      var contact = document.getElementById('apply-contact').value.trim();
      var attachment = document.getElementById('apply-attachment').value.trim();

      var payload = {
        LeaveTypeID: typeId,
        StartDate: start,
        EndDate: end,
        DayPart: dayPart,
        Reason: reason,
        EmergencyContact: contact,
        AttachmentReference: attachment
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Submitting...';

      window.NRSLJ_API.call('submitLeaveRequest', payload)
        .then(function(res) {
          window.NRSLJ_TOAST.success('Leave request submitted successfully (' + res.requestId + ')');
          window.NRSLJ_STATE.setRoute('leave-history');
        })
        .catch(function(err) {
          window.NRSLJ_TOAST.error(err.message);
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Submit Application</span>';
        });
    });

    document.getElementById('apply-back-btn').addEventListener('click', function() {
      window.NRSLJ_STATE.setRoute('dashboard');
    });

    document.getElementById('apply-cancel-btn').addEventListener('click', function() {
      window.NRSLJ_STATE.setRoute('dashboard');
    });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Employee Leave History & Request Tracking View
 */

window.NRSLJ_LEAVE_HISTORY_VIEW = (function() {
  function render(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var state = window.NRSLJ_STATE.get();
    var user = state.currentUser;
    if (!user) {
      window.NRSLJ_STATE.setRoute('auth');
      return;
    }

    container.innerHTML = '<div class="text-center" style="padding: 60px;"><span class="spinner" style="width: 32px; height: 32px;"></span><p class="text-muted mt-md">Loading leave history...</p></div>';

    window.NRSLJ_API.call('getMyLeaveRequests', {})
      .then(function(requests) {
        renderTable(container, user, requests || []);
      })
      .catch(function(err) {
        container.innerHTML = '<div class="alert alert-danger" style="margin: 20px;">' +
          '<strong>Error loading leave history:</strong> ' + escapeHtml(err.message) +
          '<button class="btn btn-sm btn-outline mt-sm" onclick="window.NRSLJ_LEAVE_HISTORY_VIEW.render(\'' + containerId + '\')">Retry</button>' +
          '</div>';
      });
  }

  function renderTable(container, user, requests) {
    var html = '' +
      '<div class="flex justify-between items-center mb-md flex-wrap gap-sm">' +
        '<div>' +
          '<h1 style="color: var(--color-primary-900); font-size: 1.4rem;">My Leave History</h1>' +
          '<p class="text-sm text-muted">Track your leave applications, approval progress, and decision notes</p>' +
        '</div>' +
        '<div class="flex gap-sm">' +
          '<button type="button" class="btn btn-primary btn-sm" id="history-apply-btn">' +
            '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>' +
            '<span>New Request</span>' +
          '</button>' +
        '</div>' +
      '</div>' +

      // Filter Bar
      '<div class="card mb-md">' +
        '<div class="card-body" style="padding: 14px 20px;">' +
          '<div class="flex items-center gap-md flex-wrap">' +
            '<div style="flex: 1; min-width: 200px;">' +
              '<input type="text" id="history-search-input" class="form-control" placeholder="Search by reason or Request ID...">' +
            '</div>' +
            '<div style="width: 200px;">' +
              '<select id="history-status-filter" class="form-select">' +
                '<option value="ALL">All Statuses</option>' +
                '<option value="PENDING_MANAGER">Pending Manager</option>' +
                '<option value="PENDING_HR">Pending HR</option>' +
                '<option value="APPROVED">Approved</option>' +
                '<option value="REJECTED">Rejected</option>' +
                '<option value="CANCELLED">Cancelled</option>' +
                '<option value="WITHDRAWN">Withdrawn</option>' +
              '</select>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      // History Table
      '<div class="card">' +
        '<div class="table-responsive">' +
          '<table class="data-table table-responsive-cards" id="history-table">' +
            '<thead>' +
              '<tr>' +
                '<th>Request ID</th>' +
                '<th>Leave Type</th>' +
                '<th>Dates</th>' +
                '<th>Days</th>' +
                '<th>Reason</th>' +
                '<th>Status</th>' +
                '<th>Submitted</th>' +
                '<th>Actions</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody id="history-table-body">';

    html += renderTableRows(requests);

    html += '</tbody></table></div></div>';

    container.innerHTML = html;

    // Filter Logic
    var searchInput = document.getElementById('history-search-input');
    var statusSelect = document.getElementById('history-status-filter');
    var tbody = document.getElementById('history-table-body');

    function applyFilters() {
      var query = searchInput.value.toLowerCase().trim();
      var selectedStatus = statusSelect.value;

      var filtered = requests.filter(function(r) {
        var matchesQuery = !query ||
          r.RequestID.toLowerCase().indexOf(query) !== -1 ||
          (r.Reason || '').toLowerCase().indexOf(query) !== -1 ||
          (r.LeaveTypeName || '').toLowerCase().indexOf(query) !== -1;

        var matchesStatus = selectedStatus === 'ALL' || r.Status === selectedStatus;
        return matchesQuery && matchesStatus;
      });

      tbody.innerHTML = renderTableRows(filtered);
      attachRowEvents();
    }

    searchInput.addEventListener('input', applyFilters);
    statusSelect.addEventListener('change', applyFilters);

    document.getElementById('history-apply-btn').addEventListener('click', function() {
      window.NRSLJ_STATE.setRoute('apply-leave');
    });

    attachRowEvents();
  }

  function renderTableRows(list) {
    if (list.length === 0) {
      return '<tr><td colspan="8" class="text-center text-muted" style="padding: 40px;">No leave requests found matching your filter.</td></tr>';
    }

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var badgeCls = 'badge-pending';
      if (r.Status === 'APPROVED') badgeCls = 'badge-approved';
      else if (r.Status === 'REJECTED') badgeCls = 'badge-rejected';
      else if (r.Status === 'CANCELLED' || r.Status === 'WITHDRAWN') badgeCls = 'badge-cancelled';

      var canCancel = (r.Status === 'PENDING_MANAGER' || r.Status === 'PENDING_HR');
      var canWithdraw = (r.Status === 'APPROVED');

      html += '' +
        '<tr data-reqid="' + r.RequestID + '">' +
          '<td data-label="Request ID"><strong style="color: var(--color-primary-900);">' + escapeHtml(r.RequestID) + '</strong></td>' +
          '<td data-label="Leave Type">' + escapeHtml(r.LeaveTypeName || r.LeaveTypeID) + '</td>' +
          '<td data-label="Dates">' + r.StartDate + (r.StartDate !== r.EndDate ? ' to ' + r.EndDate : '') + '</td>' +
          '<td data-label="Days">' + r.RequestedDays + ' (' + r.DayPart + ')</td>' +
          '<td data-label="Reason" style="max-width: 260px; word-break: break-word;" title="' + escapeHtml(r.Reason) + '">' + escapeHtml(r.Reason) + '</td>' +
          '<td data-label="Status"><span class="badge ' + badgeCls + '">' + r.Status.replace('_', ' ') + '</span></td>' +
          '<td data-label="Submitted">' + (r.SubmittedAt ? r.SubmittedAt.substring(0, 10) : '') + '</td>' +
          '<td data-label="Actions">' +
            '<div class="flex gap-xs justify-end">' +
              '<button type="button" class="btn btn-outline btn-sm action-view-details" data-id="' + r.RequestID + '" title="View Details & Approval Progress">' +
                '<span>Details</span>' +
              '</button>' +
              (canCancel ? '<button type="button" class="btn btn-danger btn-sm action-cancel" data-id="' + r.RequestID + '">Cancel</button>' : '') +
              (canWithdraw ? '<button type="button" class="btn btn-outline btn-sm action-withdraw" data-id="' + r.RequestID + '" style="color: var(--color-danger); border-color: var(--color-danger);">Withdraw</button>' : '') +
            '</div>' +
          '</td>' +
        '</tr>';
    }
    return html;
  }

  function attachRowEvents() {
    // View Details buttons
    var detailBtns = document.querySelectorAll('.action-view-details');
    for (var i = 0; i < detailBtns.length; i++) {
      detailBtns[i].addEventListener('click', function() {
        var reqId = this.getAttribute('data-id');
        showRequestDetails(reqId);
      });
    }

    // Cancel buttons
    var cancelBtns = document.querySelectorAll('.action-cancel');
    for (var j = 0; j < cancelBtns.length; j++) {
      cancelBtns[j].addEventListener('click', function() {
        var reqId = this.getAttribute('data-id');
        if (confirm('Are you sure you want to cancel this pending leave request (' + reqId + ')?')) {
          window.NRSLJ_API.call('cancelLeaveRequest', { requestId: reqId })
            .then(function() {
              window.NRSLJ_TOAST.success('Leave request cancelled');
              window.NRSLJ_LEAVE_HISTORY_VIEW.render('main-content');
            })
            .catch(function(err) {
              window.NRSLJ_TOAST.error(err.message);
            });
        }
      });
    }

    // Withdraw buttons
    var withdrawBtns = document.querySelectorAll('.action-withdraw');
    for (var k = 0; k < withdrawBtns.length; k++) {
      withdrawBtns[k].addEventListener('click', function() {
        var reqId = this.getAttribute('data-id');
        var reason = prompt('Please state the reason for withdrawing this approved leave:');
        if (reason && reason.trim().length > 0) {
          window.NRSLJ_API.call('withdrawLeaveRequest', { requestId: reqId, reason: reason.trim() })
            .then(function() {
              window.NRSLJ_TOAST.success('Approved leave withdrawn and balance credited back');
              window.NRSLJ_LEAVE_HISTORY_VIEW.render('main-content');
            })
            .catch(function(err) {
              window.NRSLJ_TOAST.error(err.message);
            });
        }
      });
    }
  }

  function showRequestDetails(requestId) {
    window.NRSLJ_API.call('getApprovalHistory', { requestId: requestId })
      .then(function(history) {
        var historyHtml = '';
        if (!history || history.length === 0) {
          historyHtml = '<p class="text-sm text-muted">No approval transitions recorded yet (Request is awaiting review).</p>';
        } else {
          historyHtml = '<div class="flex flex-col gap-sm" style="margin-top: 10px;">';
          for (var i = 0; i < history.length; i++) {
            var h = history[i];
            var isApproved = h.Decision === 'APPROVE';
            var color = isApproved ? 'var(--color-success)' : 'var(--color-danger)';
            historyHtml += '' +
              '<div style="padding: 10px 14px; border-left: 4px solid ' + color + '; background: var(--color-surface-hover); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;">' +
                '<div class="flex justify-between items-center text-xs mb-xs">' +
                  '<strong>Step ' + h.StepNumber + ': ' + h.ApproverRole + ' (' + escapeHtml(h.ApproverName || h.ApproverID) + ')</strong>' +
                  '<span class="text-muted">' + (h.ActionAt ? h.ActionAt.substring(0, 16).replace('T', ' ') : '') + '</span>' +
                '</div>' +
                '<div class="text-sm">Decision: <strong style="color: ' + color + ';">' + h.Decision + '</strong></div>' +
                (h.Comment ? '<div class="text-xs text-muted mt-xs">Comment: "' + escapeHtml(h.Comment) + '"</div>' : '') +
              '</div>';
          }
          historyHtml += '</div>';
        }

        window.NRSLJ_MODAL.open({
          title: 'Leave Request #' + requestId,
          body: '<div>' +
            '<h4 style="font-size: 1rem; margin-bottom: 8px;">Approval History & Workflow Timeline</h4>' +
            historyHtml +
            '</div>',
          footer: '<button type="button" class="btn btn-secondary btn-sm" onclick="window.NRSLJ_MODAL.close()">Close</button>'
        });
      })
      .catch(function(err) {
        window.NRSLJ_TOAST.error('Error fetching approval history: ' + err.message);
      });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

window.NRSLJ_MANAGER_DASHBOARD = (function() {

    Promise.all([

      window.NRSLJ_API.call('getDashboardMetrics', {})

    .then(function(results) {
      var pending = results[0] || [];

        '<button class="btn btn-sm btn-outline mt-sm" onclick="window.NRSLJ_MANAGER_DASHBOARD.render(\'' + containerId + '\')">Retry</button>' +

        '</div>' +

        '<div style="margin-bottom: 16px;">' +
          '<label class="form-label">Employee Reason:</label>' +
          '<div style="background: var(--color-surface); border: 1px solid var(--color-border); padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.9rem;">' +
            escapeHtml(req.Reason) +
          '</div>' +
        '</div>' +

        (req.AttachmentReference ? '<div style="margin-bottom: 16px;"><span class="text-xs text-muted">Supporting Document / Reference:</span><br><code>' + escapeHtml(req.AttachmentReference) + '</code></div>' : '') +

        '<div class="form-group">' +
          '<label class="form-label" for="decision-comment">Decision Comment / Justification:</label>' +
          '<textarea id="decision-comment" class="form-textarea" placeholder="Enter comments or reason (Mandatory if rejecting)..."></textarea>' +
          '<span class="form-hint">Note: If rejecting, a clear administrative reason must be recorded.</span>' +
        '</div>' +
      '</div>';

    var footerHtml = '' +
      '<button type="button" class="btn btn-secondary" onclick="window.NRSLJ_MODAL.close()">Cancel</button>' +
      '<button type="button" class="btn btn-danger" id="modal-reject-btn">Reject Request</button>' +
      '<button type="button" class="btn btn-success" id="modal-approve-btn">' +
        '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' +
        '<span>Approve Request</span>' +
      '</button>';

    var dialog = window.NRSLJ_MODAL.open({
      title: 'Review Leave Request #' + req.RequestID,
      body: bodyHtml,
      footer: footerHtml
    });

    var commentInput = dialog.querySelector('#decision-comment');
    var approveBtn = dialog.querySelector('#modal-approve-btn');
    var rejectBtn = dialog.querySelector('#modal-reject-btn');

    approveBtn.addEventListener('click', function() {
      processDecision(req.RequestID, 'APPROVE', commentInput.value.trim(), approveBtn, rejectBtn);
    });

    rejectBtn.addEventListener('click', function() {
      var comment = commentInput.value.trim();
      if (comment.length < 3) {
        window.NRSLJ_TOAST.error('A rejection reason is mandatory (at least 3 characters)');
        commentInput.focus();
        return;
      }
      processDecision(req.RequestID, 'REJECT', comment, rejectBtn, approveBtn);
    });
  }

  function processDecision(requestId, decision, comment, activeBtn, otherBtn) {
    activeBtn.disabled = true;
    otherBtn.disabled = true;
    activeBtn.innerHTML = '<span class="spinner"></span> Processing...';

    window.NRSLJ_API.call('processApprovalDecision', {
      requestId: requestId,
      decision: decision,
      comment: comment
    })
    .then(function(res) {
      window.NRSLJ_TOAST.success('Request ' + requestId + ' marked as ' + res.newStatus);
      window.NRSLJ_MODAL.close();
      window.NRSLJ_MANAGER_DASHBOARD.render('main-content');
    })
    .catch(function(err) {
      window.NRSLJ_TOAST.error(err.message);
      activeBtn.disabled = false;
      otherBtn.disabled = false;
      activeBtn.innerHTML = decision === 'APPROVE' ? 'Approve Request' : 'Reject Request';
    });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

      var q = searchInput.value.toLowerCase().trim();
      var dept = deptFilter.value;
      var role = roleFilter.value;
      var status = statusFilter.value;

      var filtered = allEmps.filter(function(e) {
        var matchQ = !q ||
          (e.FullName || '').toLowerCase().indexOf(q) !== -1 ||
          (e.EmployeeID || '').toLowerCase().indexOf(q) !== -1 ||
          (e.Username || '').toLowerCase().indexOf(q) !== -1 ||
          (e.Phone || '').indexOf(q) !== -1;

        var matchDept = dept === 'ALL' || e.DepartmentID === dept;
        var matchRole = role === 'ALL' || e.Role === role;
        var matchStatus = status === 'ALL' || e.AccountStatus === status;

        return matchQ && matchDept && matchRole && matchStatus;
