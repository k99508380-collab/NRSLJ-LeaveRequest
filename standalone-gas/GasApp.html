  function renderCalendarGrid(year, month, events) {
    var daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var firstDay = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();

    var html = '<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;">';

    // Day headers
    for (var d = 0; d < 7; d++) {
      html += '<div style="text-align: center; font-weight: 700; font-size: 0.8rem; color: var(--color-text-muted); padding: 8px 0; background: var(--color-surface-hover); border-radius: var(--radius-sm);">' + daysOfWeek[d] + '</div>';
    }

    // Leading blanks
    for (var b = 0; b < firstDay; b++) {
      html += '<div style="min-height: 80px; background: #f8fafc; border-radius: var(--radius-sm); border: 1px dashed var(--color-border); opacity: 0.4;"></div>';
    }

    // Day cells
    for (var day = 1; day <= daysInMonth; day++) {
      var dayStr = year + '-' + (month < 10 ? '0' + month : month) + '-' + (day < 10 ? '0' + day : day);
      var dayEvents = events.filter(function(e) {
        return dayStr >= e.startDate && dayStr <= e.endDate;
      });

      var isToday = new Date().toISOString().substring(0, 10) === dayStr;

      html += '<div style="min-height: 85px; background: var(--color-surface); border: 1px solid ' + (isToday ? 'var(--color-teal-600)' : 'var(--color-border)') + '; border-radius: var(--radius-sm); padding: 6px; display: flex; flex-direction: column;">' +
        '<div class="flex justify-between items-center mb-xs">' +
          '<strong style="font-size: 0.8rem;' + (isToday ? ' color: var(--color-teal-600);' : '') + '">' + day + '</strong>' +
          (dayEvents.length > 0 ? '<span class="badge badge-active" style="font-size: 0.65rem; padding: 1px 5px;">' + dayEvents.length + '</span>' : '') +
        '</div>' +
        '<div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;">';

      for (var ev = 0; ev < dayEvents.length; ev++) {
        var eItem = dayEvents[ev];
        html += '<div style="background: var(--color-teal-50); border: 1px solid var(--color-teal-100); border-radius: 3px; padding: 2px 4px; font-size: 0.7rem; color: var(--color-teal-700); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;" title="' + escapeHtml(eItem.employeeName) + ' (' + escapeHtml(eItem.leaveType) + ')">' +
          '<strong>' + escapeHtml(eItem.employeeName) + '</strong> (' + escapeHtml(eItem.departmentName) + ')' +
          '</div>';
      }

      html += '</div></div>';
    }

    html += '</div>';
    return html;
  }

  function triggerExport(reportType) {
    window.NRSLJ_TOAST.info('Preparing ' + reportType + ' export...');

    window.NRSLJ_API.call('exportReportCsv', { reportType: reportType })
      .then(function(res) {
        if (!res || !res.content) {
          throw new Error('Export returned empty content');
        }

        // Trigger safe client-side file download
        var blob = new Blob([res.content], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = res.filename || 'NRSLJ_Report.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        window.NRSLJ_TOAST.success('Report downloaded: ' + a.download);
      })
      .catch(function(err) {
        window.NRSLJ_TOAST.error('Export failed: ' + err.message);
      });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

              '<button type="submit" class="btn btn-primary" id="save-settings-btn">' +
                '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' +
                '<span>Save Hospital Settings</span>' +
              '</button>' +
            '</div>' +

          '</div>' +

        '</form>' +
      '</div>';

    container.innerHTML = html;

    // Logo File Upload Handling
    var fileInput = document.getElementById('logo-file-input');
    var logoPreview = document.getElementById('settings-logo-preview');
    var logoUrlInput = document.getElementById('setting-logo-url');

    fileInput.addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (file) {
        if (file.size > 1024 * 500) {
          window.NRSLJ_TOAST.warning('Image is larger than 500KB. For best spreadsheet performance, use a compressed logo.');
        }
        var reader = new FileReader();
        reader.onload = function(evt) {
          var base64Data = evt.target.result;
          logoPreview.src = base64Data;
          logoUrlInput.value = base64Data;
        };
        reader.readAsDataURL(file);
      }
    });

    logoUrlInput.addEventListener('input', function() {
      var val = logoUrlInput.value.trim();
      logoPreview.src = val.length > 0 ? val : 'assets/logo.svg';
    });

    document.getElementById('btn-reset-logo').addEventListener('click', function() {
      logoUrlInput.value = '';
      logoPreview.src = 'assets/logo.svg';
      fileInput.value = '';
      window.NRSLJ_TOAST.info('Logo reset to default emblem');
    });

    // Form Save
    document.getElementById('hospital-settings-form').addEventListener('submit', function(e) {
      e.preventDefault();

      var selectedWf = 'MANAGER_THEN_HR';
      var radios = document.querySelectorAll('input[name="workflow-mode"]');
      for (var r = 0; r < radios.length; r++) {
        if (radios[r].checked) selectedWf = radios[r].value;
      }

      var payload = {
        HOSPITAL_NAME: document.getElementById('setting-hospital-name').value.trim(),
        LOGO_URL: logoUrlInput.value.trim(),
        HOSPITAL_PHONE: document.getElementById('setting-phone').value.trim(),
        HOSPITAL_EMAIL: document.getElementById('setting-email').value.trim(),
        HOSPITAL_ADDRESS: document.getElementById('setting-address').value.trim(),
        APPROVAL_WORKFLOW: selectedWf,
        ALLOW_PAST_LEAVE_DAYS: document.getElementById('setting-backdated').value
      };

      var btn = document.getElementById('save-settings-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Saving...';

      window.NRSLJ_API.call('updateSettings', payload)
        .then(function(saved) {
          window.NRSLJ_TOAST.success('Hospital settings updated successfully');
          window.NRSLJ_STATE.setHospitalSettings(saved);

          // Update header brand
          var headerLogo = document.getElementById('header-brand-logo');
          if (headerLogo) {
            headerLogo.src = saved.LOGO_URL && saved.LOGO_URL.length > 0 ? saved.LOGO_URL : 'assets/logo.svg';
          }
        })
        .catch(function(err) {
          window.NRSLJ_TOAST.error(err.message);
        })
        .finally(function() {
          btn.disabled = false;
          btn.innerHTML = '<span>Save Hospital Settings</span>';
        });
    });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

window.NRSLJ_AUDIT_LOGS_VIEW = (function() {
  function render(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var state = window.NRSLJ_STATE.get();
    var user = state.currentUser;
    if (!user || user.Role !== 'ADMIN') {
      window.NRSLJ_STATE.setRoute('dashboard');
      return;
    }

    container.innerHTML = '<div class="text-center" style="padding: 60px;"><span class="spinner" style="width: 32px; height: 32px;"></span><p class="text-muted mt-md">Loading system audit trail...</p></div>';

    window.NRSLJ_API.call('getAuditLogs', { limit: 150 })
      .then(function(logs) {
        renderTable(container, logs || []);
      })
      .catch(function(err) {
        container.innerHTML = '<div class="alert alert-danger" style="margin: 20px;">' +
          '<strong>Error loading audit logs:</strong> ' + escapeHtml(err.message) +
          '<button class="btn btn-sm btn-outline mt-sm" onclick="window.NRSLJ_AUDIT_LOGS_VIEW.render(\'' + containerId + '\')">Retry</button>' +
          '</div>';
      });
  }

  function renderTable(container, logs) {
    var html = '' +
      '<div class="flex justify-between items-center mb-md flex-wrap gap-sm">' +
        '<div>' +
          '<h1 style="color: var(--color-primary-900); font-size: 1.4rem;">System Audit Trail</h1>' +
          '<p class="text-sm text-muted">Immutable log of security actions, approval transitions, and administrative operations</p>' +
        '</div>' +
        '<div class="flex gap-sm">' +
          '<button type="button" class="btn btn-outline btn-sm" id="btn-refresh-audit">' +
            '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>' +
            '<span>Refresh</span>' +
          '</button>' +
        '</div>' +
      '</div>' +

      // Search Filter
      '<div class="card mb-md">' +
        '<div class="card-body" style="padding: 14px 20px;">' +
          '<input type="text" id="audit-search-input" class="form-control" placeholder="Search by Actor, Action (e.g. LOGIN, APPROVAL), or Entity ID...">' +
        '</div>' +
      '</div>' +

      // Table Card
      '<div class="card">' +
        '<div class="table-responsive">' +
          '<table class="data-table table-responsive-cards">' +
            '<thead>' +
              '<tr>' +
                '<th>Audit ID</th>' +
                '<th>Timestamp</th>' +
                '<th>Actor</th>' +
                '<th>Action</th>' +
                '<th>Entity</th>' +
                '<th>Result</th>' +
                '<th>Details</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody id="audit-table-body">';

    html += renderRows(logs);

    html += '</tbody></table></div></div>';

    container.innerHTML = html;

    // Filter Logic
    var searchInput = document.getElementById('audit-search-input');
    var tbody = document.getElementById('audit-table-body');

    searchInput.addEventListener('input', function() {
      var q = searchInput.value.toLowerCase().trim();
      var filtered = logs.filter(function(l) {
        return !q ||
          (l.AuditID || '').toLowerCase().indexOf(q) !== -1 ||
          (l.ActorID || '').toLowerCase().indexOf(q) !== -1 ||
          (l.Action || '').toLowerCase().indexOf(q) !== -1 ||
          (l.EntityID || '').toLowerCase().indexOf(q) !== -1 ||
          (l.SanitizedDetails || '').toLowerCase().indexOf(q) !== -1;
      });
      tbody.innerHTML = renderRows(filtered);
      attachDetailEvents();
    });

    document.getElementById('btn-refresh-audit').addEventListener('click', function() {
      window.NRSLJ_AUDIT_LOGS_VIEW.render('main-content');
    });

    attachDetailEvents();
  }

  function renderRows(list) {
    if (list.length === 0) {
      return '<tr><td colspan="7" class="text-center text-muted" style="padding: 30px;">No audit records found.</td></tr>';
    }

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var l = list[i];
      var isSuccess = l.Result === 'SUCCESS';

      html += '' +
        '<tr>' +
          '<td data-label="Audit ID"><code style="font-size: 0.8rem;">' + escapeHtml(l.AuditID) + '</code></td>' +
          '<td data-label="Timestamp" class="text-xs">' + (l.Timestamp ? l.Timestamp.replace('T', ' ').substring(0, 19) : '') + '</td>' +
          '<td data-label="Actor"><strong>' + escapeHtml(l.ActorID) + '</strong></td>' +
          '<td data-label="Action"><span class="badge ' + (isSuccess ? 'badge-active' : 'badge-rejected') + '">' + escapeHtml(l.Action) + '</span></td>' +
          '<td data-label="Entity">' + escapeHtml(l.EntityType) + (l.EntityID ? ' (' + escapeHtml(l.EntityID) + ')' : '') + '</td>' +
          '<td data-label="Result">' +
            '<span class="badge ' + (isSuccess ? 'badge-approved' : 'badge-rejected') + '">' + escapeHtml(l.Result) + '</span>' +
          '</td>' +
          '<td data-label="Details">' +
            '<button type="button" class="btn btn-outline btn-sm action-view-audit-detail" data-json="' + escapeHtml(l.SanitizedDetails || '{}') + '">Inspect</button>' +
          '</td>' +
        '</tr>';
    }
    return html;
  }

  function attachDetailEvents() {
    var btns = document.querySelectorAll('.action-view-audit-detail');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function() {
        var rawJson = this.getAttribute('data-json');
        var pretty = rawJson;
        try {
          pretty = JSON.stringify(JSON.parse(rawJson), null, 2);
        } catch (e) {}

        window.NRSLJ_MODAL.open({
          title: 'Audit Event Details',
          body: '<pre style="background: var(--color-surface-hover); padding: 14px; border-radius: var(--radius-md); font-size: 0.8rem; overflow-x: auto; max-height: 350px;">' +
            escapeHtml(pretty) +
            '</pre>',
          footer: '<button type="button" class="btn btn-secondary btn-sm" onclick="window.NRSLJ_MODAL.close()">Close</button>'
        });
      });
    }
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

            '<div style="background: var(--color-surface-hover); padding: 12px; border-radius: var(--radius-sm);">' +

            '</div>' +

              '<span class="text-xs text-muted">Active Staff Records:</span><br>' +
              '<strong>' + diag.employeeCount + ' Registered</strong>' +
            '</div>' +
            '<div style="background: var(--color-surface-hover); padding: 12px; border-radius: var(--radius-sm);">' +
              '<span class="text-xs text-muted">Administrators:</span><br>' +
              '<strong>' + diag.adminCount + ' Admin(s)</strong>' +
            '</div>' +
          '</div>';

        html += '<h4 style="font-size: 0.95rem; margin-bottom: 8px;">Database Tables Verification:</h4>' +
          '<div style="max-height: 220px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">' +
          '<table class="data-table" style="font-size: 0.8rem;">' +
            '<thead><tr><th>Table / Sheet Name</th><th>Status</th><th>Headers Status</th></tr></thead><tbody>';

        var sheetsCheck = diag.sheetsCheck || {};
        var sNames = Object.keys(sheetsCheck);
        for (var i = 0; i < sNames.length; i++) {
          var sn = sNames[i];
          var sc = sheetsCheck[sn];
          html += '<tr>' +
            '<td><code>' + sn + '</code></td>' +
            '<td>' + (sc.exists ? '<span style="color: var(--color-success); font-weight: 700;">&check; Present</span>' : '<span style="color: var(--color-danger); font-weight: 700;">&cross; Missing</span>') + '</td>' +
            '<td>' + (sc.headersOk ? '<span style="color: var(--color-success);">&check; Valid</span>' : '<span style="color: var(--color-warning);">Headers Mismatch</span>') + '</td>' +
          '</tr>';
        }

        html += '</tbody></table></div>';

        if (!diag.allSheetsPresent) {
          html += '<div class="mt-md">' +
            '<button type="button" class="btn btn-primary btn-sm" id="btn-fix-init-db">Run Database Auto-Initialization</button>' +
            '</div>';
        }

        pane.innerHTML = html;

        var initBtn = document.getElementById('btn-fix-init-db');
        if (initBtn) {
          initBtn.addEventListener('click', function() {
            window.NRSLJ_API.call('initDatabase', {})
              .then(function() {
                window.NRSLJ_TOAST.success('Database initialized! Rerunning diagnostics...');
                executeDiagnostics();
              })
              .catch(function(err) {
                window.NRSLJ_TOAST.error('Init failed: ' + err.message);
              });
          });
        }
      })
      .catch(function(err) {
        pane.innerHTML = '<div class="alert alert-danger text-sm">' +
          '<strong>Diagnostics Failed:</strong> ' + escapeHtml(err.message) +
          '</div>';
      })
      .finally(function() {
        btn.disabled = false;
        btn.innerHTML = '<span>Run Full Diagnostics</span>';
      });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
  }

  return {
    render: render
  };
})();

/**
 * NRSLJ SPECIALITY HOSPITALS, MUSIRI
 * Employee Leave Management System - Main Application Orchestrator & Router
 */

(function() {
  document.addEventListener('DOMContentLoaded', initApp);

  function initApp() {
    // 1. Initial Header & Sidebar rendering
    window.NRSLJ_HEADER.render('app-header');
    window.NRSLJ_SIDEBAR.render('app-sidebar');

    // 2. Subscribe to state changes to update navigation & views
    window.NRSLJ_STATE.subscribe(function(state, key) {
      if (key === 'user' || key === 'settings' || key === 'notifications') {
        window.NRSLJ_HEADER.render('app-header');
        window.NRSLJ_SIDEBAR.render('app-sidebar');
      }

      if (key === 'route' || key === 'user') {
        renderCurrentRoute();
      }
    });

    // 3. Hash change listener for browser navigation
    window.addEventListener('hashchange', function() {
      var hash = window.location.hash.replace('#', '').trim();
      if (hash && hash !== window.NRSLJ_STATE.get().currentRoute) {
        window.NRSLJ_STATE.setRoute(hash);
      }
    });

    // 4. Check session
    window.NRSLJ_AUTH.checkSession()
      .then(function(user) {
        if (!user) {
          // If hash is diagnostics, allow viewing without login
          var initialHash = window.location.hash.replace('#', '').trim();
          if (initialHash === 'diagnostics') {
            window.NRSLJ_STATE.setRoute('diagnostics');
          } else {
            window.NRSLJ_STATE.setRoute('auth');
          }
        } else {
          var initialHash = window.location.hash.replace('#', '').trim();
          if (initialHash) {
            window.NRSLJ_STATE.setRoute(initialHash);
          } else {
            // Default route by role
            if (user.Role === 'ADMIN') {
              window.NRSLJ_STATE.setRoute('admin-dashboard');
            } else if (user.Role === 'MANAGER') {
              window.NRSLJ_STATE.setRoute('manager-dashboard');
            } else {
              window.NRSLJ_STATE.setRoute('dashboard');
            }
          }
        }
      });
  }

  function renderCurrentRoute() {
    var state = window.NRSLJ_STATE.get();
    var route = state.currentRoute;
    var user = state.currentUser;

    // Update URL hash without reload
    if (window.location.hash !== '#' + route) {
      history.replaceState(null, null, '#' + route);
    }

    // Role Guard: if not authenticated and not in diagnostics, redirect to auth
    if (!user && route !== 'auth' && route !== 'diagnostics') {
      window.NRSLJ_STATE.setRoute('auth');
      return;
    }

    // If authenticated and on auth route, redirect to dashboard
    if (user && route === 'auth') {
      window.NRSLJ_STATE.setRoute('dashboard');
      return;
    }

    // Re-render sidebar active state
    window.NRSLJ_SIDEBAR.render('app-sidebar');

    // Route dispatch
    switch (route) {
      case 'auth':
        window.NRSLJ_AUTH_VIEW.render('main-content');
        break;

      case 'dashboard':
        window.NRSLJ_EMPLOYEE_DASHBOARD.render('main-content');
        break;

      case 'apply-leave':
        window.NRSLJ_LEAVE_APPLY_VIEW.render('main-content');
        break;

      case 'leave-history':
        window.NRSLJ_LEAVE_HISTORY_VIEW.render('main-content');
        break;

      case 'manager-dashboard':
        window.NRSLJ_MANAGER_DASHBOARD.render('main-content');
        break;

      case 'admin-dashboard':
        window.NRSLJ_ADMIN_DASHBOARD.render('main-content');
        break;

      case 'admin-registrations':
        window.NRSLJ_ADMIN_EMPLOYEES_VIEW.render('main-content', 'pending');
        break;

      case 'admin-employees':
        window.NRSLJ_ADMIN_EMPLOYEES_VIEW.render('main-content', 'all');
        break;

      case 'admin-leave-config':
        window.NRSLJ_ADMIN_LEAVE_CONFIG_VIEW.render('main-content');
        break;

      case 'admin-reports':
        window.NRSLJ_ADMIN_REPORTS_VIEW.render('main-content');
        break;

      case 'hospital-settings':
        window.NRSLJ_HOSPITAL_SETTINGS_VIEW.render('main-content');
        break;

      case 'audit-logs':
        window.NRSLJ_AUDIT_LOGS_VIEW.render('main-content');
        break;

      case 'diagnostics':
        window.NRSLJ_DIAGNOSTICS_VIEW.render('main-content');
        break;

      default:
        window.NRSLJ_EMPLOYEE_DASHBOARD.render('main-content');
        break;
    }
  }
})();

  </script>
</body>
</html>
